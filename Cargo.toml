[package]
name = "homeops"
version = "0.1.0-rc.1"
edition = "2024"
publish = false

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
csv = "1"
tempfile = "3"
mdns-sd = { version = "=0.21.6", default-features = false }
if-addrs = "=0.15.0"

portable-pty = "=0.9.0"
vt100 = "=0.16.2"

rfd = "=0.15.4"
egui-winit = { version = "=0.33.3", default-features = false }
raw-window-handle = "=0.6.2"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
